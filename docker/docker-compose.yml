services:

  uce-buslink-db:
    image: postgis/postgis:15-3.3-alpine
    container_name: uce-buslink-db
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - uce-buslink-db-data:/var/lib/postgresql/data
    networks:
      - uce-buslink-net
    expose:
      - "5432"
    deploy:
      resources:
        limits:
          memory: 512M
          cpus: '0.50'
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    restart: always

  uce-buslink-redis:
    image: redis:7.2-alpine
    container_name: uce-buslink-redis
    command: redis-server --appendonly yes --requirepass ${REDIS_PASSWORD}
    volumes:
      - uce-buslink-redis-data:/data
    networks:
      - uce-buslink-net
    expose:
      - "6379"
    deploy:
      resources:
        limits:
          memory: 128M
          cpus: '0.25'
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD}", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    restart: always

  uce-buslink-backend:
    image: rodneyandrade/uce-buslink-backend:${BACKEND_TAG}
    container_name: uce-buslink-backend
    env_file:
      - .env
    environment:
      SPRING_PROFILES_ACTIVE: ${SPRING_PROFILES_ACTIVE:-prod}
      APP_NAME: ${APP_NAME:-uce-buslink-backend}
      SERVER_PORT: "8080"
      SPRING_MAIN_WEB_APPLICATION_TYPE: servlet
      DB_URL: jdbc:postgresql://uce-buslink-db:5432/${POSTGRES_DB}
      DB_USERNAME: ${POSTGRES_USER}
      DB_PASSWORD: ${POSTGRES_PASSWORD}
      DB_DRIVER: org.postgresql.Driver
      JPA_DIALECT: org.hibernate.dialect.PostgreSQLDialect
      HIBERNATE_DDL_AUTO: validate
      JPA_SHOW_SQL: "false"
      HIBERNATE_FORMAT_SQL: "false"
      REDIS_HOST: uce-buslink-redis
      REDIS_PORT: "6379"
      REDIS_PASSWORD: ${REDIS_PASSWORD}
      FLYWAY_ENABLED: "true"
      FLYWAY_LOCATIONS: classpath:db/migration
      FLYWAY_VALIDATE: "true"
      FLYWAY_BASELINE: "true"
    expose:
      - "8080"
    networks:
      - uce-buslink-net
    deploy:
      resources:
        limits:
          memory: 512M
          cpus: '1.00'
    depends_on:
      uce-buslink-db:
        condition: service_healthy
      uce-buslink-redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget --no-verbose --tries=1 --spider http://127.0.0.1:8080/actuator/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    restart: always

  uce-buslink-frontend:
    image: rodneyandrade/uce-buslink-frontend-web:${FRONTEND_TAG}
    container_name: uce-buslink-frontend
    ports:
      - "80:80"
    networks:
      - uce-buslink-net
    deploy:
      resources:
        limits:
          memory: 64M
          cpus: '0.25'
    depends_on:
      uce-buslink-backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget --no-verbose --tries=1 --spider http://127.0.0.1:80 || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    restart: always

  uce-buslink-storybook:
    image: rodneyandrade/uce-buslink-storybook:${STORYBOOK_TAG:-latest}
    container_name: uce-buslink-storybook
    networks:
      - uce-buslink-net
    deploy:
      resources:
        limits:
          memory: 64M
          cpus: '0.25'
    healthcheck:
      test: ["CMD-SHELL", "wget --no-verbose --tries=1 --spider http://127.0.0.1:80 || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    restart: always

  uce-buslink-dozzle:
    image: amir20/dozzle:latest
    container_name: uce-buslink-dozzle
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - ./dozzle-users.yml:/data/users.yml:ro
    environment:
      DOZZLE_AUTH_PROVIDER: simple
    ports:
      - "8080:8080"
    networks:
      - uce-buslink-net
    deploy:
      resources:
        limits:
          memory: 64M
          cpus: '0.10'
    restart: always

volumes:
  uce-buslink-db-data:
    driver: local
  uce-buslink-redis-data:
    driver: local

networks:
  uce-buslink-net:
    driver: bridge

services:

  uce-buslink-db:
    image: postgis/postgis:15-3.3-alpine
    container_name: uce-buslink-db
   
    environment:
      POSTGRES_USER: buslink_user
      POSTGRES_PASSWORD: buslink_local_pass
      POSTGRES_DB: uce_buslink_db
    ports:
      - "5434:5432"
    
    volumes:
      - uce-buslink-db-data:/var/lib/postgresql/data
    networks:
      - uce-buslink-net
    deploy:
      resources:
        limits:
          memory: 512M
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U buslink_user -d uce_buslink_db"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    restart: unless-stopped

  uce-buslink-redis:
    image: redis:7.2-alpine
    container_name: uce-buslink-redis
    command: redis-server --appendonly yes
    ports:
      - "6380:6379"
    
    volumes:
      - uce-buslink-redis-data:/data
    networks:
      - uce-buslink-net
    deploy:
      resources:
        limits:
          memory: 128M
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    restart: unless-stopped

  uce-buslink-backend:
    build:
      context: ../
      dockerfile: docker/Dockerfile.backend
    container_name: uce-buslink-backend
    env_file:
      - ../.env
    environment:
      # Sobreescribe SOLO las variables que cambian en Docker
      # El resto viene del .env 
      DB_URL: jdbc:postgresql://uce-buslink-db:5432/uce_buslink_db
      DB_USERNAME: buslink_user
      DB_PASSWORD: buslink_local_pass
      REDIS_HOST: uce-buslink-redis
      REDIS_PORT: "6379"
    ports:
      - "8080:8080"
    networks:
      - uce-buslink-net
    deploy:
      resources:
        limits:
          memory: 512M
    depends_on:
      uce-buslink-db:
        condition: service_healthy
      uce-buslink-redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget --no-verbose --tries=1 --spider http://localhost:8080/actuator/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    restart: unless-stopped

  uce-buslink-frontend:
    build:
      context: ../
      dockerfile: docker/Dockerfile.frontend
    container_name: uce-buslink-frontend
    environment:
      ENABLE_HTTPS: "false"
    ports:
      - "3000:80"
    networks:
      - uce-buslink-net
    deploy:
      resources:
        limits:
          memory: 64M
    depends_on:
      uce-buslink-backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget --no-verbose --tries=1 --spider http://localhost:80/healthz || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    restart: unless-stopped

volumes:
  uce-buslink-db-data:
    driver: local
  uce-buslink-redis-data:
    driver: local

networks:
  uce-buslink-net:
    driver: bridge
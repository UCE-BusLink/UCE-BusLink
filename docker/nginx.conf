# =============================================================================
# UCE-BUSLINK — Configuración Nginx para SPA (Single Page Application)
# React Router necesita que TODAS las rutas sirvan index.html
# =============================================================================

server {
    listen 80;
    server_name _;

    # Directorio donde están los archivos compilados
    root /usr/share/nginx/html;
    index index.html;

    # Seguridad: ocultar versión de Nginx en headers
    server_tokens off;

    # Headers de seguridad básicos
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;


    location / {
        try_files $uri $uri/ /index.html;
    }

       location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        access_log off;
    }

    
    location /api/ {
        proxy_pass http://uce-buslink-backend:8080/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Timeouts para Spring WebFlux reactivo
        proxy_connect_timeout 10s;
        proxy_read_timeout 60s;
    }

    # Denegar acceso a archivos ocultos (.env, .git, etc.)
    location ~ /\. {
        deny all;
        access_log off;
        log_not_found off;
    }
}
server {
    listen 80;
    listen [::]:80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    server_tokens off;

    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline' 'unsafe-eval' https://accounts.google.com https://*.microsoftonline.com https://*.clerk.com https://*.clerk.accounts.dev; style-src 'self' 'unsafe-inline'; img-src 'self' data: https: blob:; font-src 'self' data:; connect-src 'self' https://accounts.google.com https://*.microsoftonline.com https://*.clerk.com https://*.clerk.dev https://*.clerk.accounts.dev https://fcmregistrations.googleapis.com https://firebaseinstallations.googleapis.com https://www.gstatic.com https://clerk-telemetry.com https://router.project-osrm.org; frame-src 'self' https://accounts.google.com https://*.microsoftonline.com https://*.clerk.accounts.dev; worker-src blob: 'self';" always;

    location / {
        try_files $uri $uri/ /index.html;
    }

    # Storybook se ejecuta en la red interna Docker. No expone puertos al host:
    # se publica exclusivamente a traves de esta ruta.
    location = /storybook {
        return 301 /storybook/;
    }

    location /storybook/ {
        resolver 127.0.0.11 valid=30s;
        set $storybook_upstream http://uce-buslink-storybook:80;
        rewrite ^/storybook/(.*)$ /$1 break;
        proxy_pass $storybook_upstream;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 10s;
        proxy_read_timeout 60s;
    }

    location = /firebase-messaging-sw.js {
        add_header Cache-Control "no-cache";
    }

    # El service worker de la PWA (vite-plugin-pwa) y su manifest no llevan hash
    # en el nombre; cachearlos igual que el resto de assets rompe la detección
    # de actualizaciones del SW y provoca recargas en bucle.
    location = /sw.js {
        add_header Cache-Control "no-cache";
    }

    location = /manifest.webmanifest {
        add_header Cache-Control "no-cache";
    }

    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        access_log off;
    }

    location /api/ws/ {
        resolver 127.0.0.11 valid=30s;
        set $ws_upstream http://uce-buslink-backend:8080;
        rewrite ^/api/(.*) /$1 break;
        proxy_pass $ws_upstream;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 10s;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    location /api/ {
        resolver 127.0.0.11 valid=30s;
        set $upstream http://uce-buslink-backend:8080;
        rewrite ^/api/(.*) /$1 break;
        proxy_pass $upstream;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 10s;
        proxy_read_timeout 60s;
    }

    location ~ /\. {
        deny all;
        access_log off;
        log_not_found off;
    }
}

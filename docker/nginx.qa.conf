# =============================================================================
# UCE-BUSLINK — Nginx config QA (HTTPS)
# =============================================================================

server {
    listen 80;
    server_name ucebuslinkqa.programacionwebuce.net;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    server_name ucebuslinkqa.programacionwebuce.net;

    ssl_certificate     /etc/letsencrypt/live/ucebuslinkqa.programacionwebuce.net/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/ucebuslinkqa.programacionwebuce.net/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         HIGH:!aNULL:!MD5;
    ssl_prefer_server_ciphers on;

    root /usr/share/nginx/html;
    index index.html;

    server_tokens off;

    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline' 'unsafe-eval' https://accounts.google.com https://*.microsoftonline.com https://*.clerk.com https://*.clerk.accounts.dev; style-src 'self' 'unsafe-inline'; img-src 'self' data: https:; font-src 'self' data:; connect-src 'self' https://accounts.google.com https://*.microsoftonline.com https://*.clerk.com https://*.clerk.dev https://*.clerk.accounts.dev; frame-src 'self' https://accounts.google.com https://*.microsoftonline.com https://*.clerk.accounts.dev; worker-src 'self' blob:;" always;

    location / {
        try_files $uri $uri/ /index.html;
    }

    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        access_log off;
    }

    location /api/ {
        proxy_pass http://uce-buslink-backend:8080/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 10s;
        proxy_read_timeout 60s;
    }

    location ~ /\. {
        deny all;
        access_log off;
        log_not_found off;
    }
}

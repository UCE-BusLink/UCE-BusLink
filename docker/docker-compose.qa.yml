# =============================================================================
# UCE-BUSLINK — Sobreescritura para ambiente QA
# Uso: docker compose -f docker-compose.yml -f docker-compose.qa.yml up -d
# =============================================================================

services:

  uce-buslink-backend:
    image: rodneyandrade/uce-buslink-backend:${BACKEND_TAG:-qa}
    environment:
      SPRING_PROFILES_ACTIVE: qa
      JPA_SHOW_SQL: "true"
      HIBERNATE_FORMAT_SQL: "true"

  uce-buslink-frontend:
    image: rodneyandrade/uce-buslink-frontend-desktop:${FRONTEND_TAG:-qa}

# =============================================================================
# UCE-BUSLINK — Sobreescritura para ambiente PRODUCCIÓN (Main)
# Uso: docker compose -f docker-compose.yml -f docker-compose.prod.yml up -d
# =============================================================================

services:

  uce-buslink-backend:
    image: rodneyandrade/uce-buslink-backend:${BACKEND_TAG}
    environment:
      SPRING_PROFILES_ACTIVE: prod
      JPA_SHOW_SQL: "false"
      HIBERNATE_FORMAT_SQL: "false"

  uce-buslink-frontend:
    image: rodneyandrade/uce-buslink-frontend-desktop:${FRONTEND_TAG}
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - /etc/letsencrypt:/etc/letsencrypt:ro
      - ~/uce-buslink/docker/nginx.prod.conf:/etc/nginx/conf.d/app.conf:ro
# =============================================================================
# UCE-BUSLINK — Sobreescritura para ambiente PRODUCCIÓN (Main)
# Uso: docker compose -f docker-compose.yml -f docker-compose.prod.yml up -d
# =============================================================================

services:

  uce-buslink-backend:
    image: rodneyandrade/uce-buslink-backend:${BACKEND_TAG:-latest}
    environment:
      SPRING_PROFILES_ACTIVE: prod
      # En producción NO mostramos SQL
      JPA_SHOW_SQL: "false"
      HIBERNATE_FORMAT_SQL: "false"

  uce-buslink-frontend:
    image: rodneyandrade/uce-buslink-frontend-desktop:${FRONTEND_TAG:-latest}
    ports:
      - "80:80"
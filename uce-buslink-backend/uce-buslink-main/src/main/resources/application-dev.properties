# ==========================================
# LOGGING — dev profile only
# Verbose levels for local debugging. NEVER copy these into qa/prod:
# TRACE-level JDBC bind logging prints real query parameter values,
# and TRACE websocket/messaging logs flood the console under load.
# ==========================================

logging.level.com.ucebuslink=DEBUG
logging.level.org.hibernate.SQL=DEBUG
logging.level.org.hibernate.orm.jdbc.bind=TRACE
logging.level.org.springframework.web.socket=DEBUG
logging.level.org.springframework.messaging=DEBUG
logging.level.org.springframework.security=DEBUG

spring.application.name=${APP_NAME:uce-buslink-backend}

# Configuración del Servidor Reactivo (Netty)
server.port=${SERVER_PORT:8080}
# spring.main.web-application-type=${WEB_APPLICATION_TYPE:reactive}

# Persistencia Relacional - PostgreSQL
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=${DB_DRIVER:org.postgresql.Driver}

# Configuración de Hibernate / JPA
spring.jpa.database-platform=${JPA_DIALECT:org.hibernate.dialect.PostgreSQLDialect}

# CRITICAL: "validate" asegura que Hibernate NO intente alterar las tablas, respetando a Flyway
spring.jpa.hibernate.ddl-auto=${HIBERNATE_DDL_AUTO:validate}

# show-sql writes straight to System.out, bypassing SLF4J/Logback entirely (no level,
# no color, no environment control). Keep it off and use logging.level.org.hibernate.SQL
# instead, which respects the per-profile levels in application-{dev,qa,prod}.properties.
spring.jpa.show-sql=${JPA_SHOW_SQL:false}
spring.jpa.properties.hibernate.format_sql=${HIBERNATE_FORMAT_SQL:true}

# Caché y Telemetría en Tiempo Real - Redis
spring.data.redis.host=${REDIS_HOST:localhost}
spring.data.redis.port=${REDIS_PORT:6379}
spring.data.redis.password=${REDIS_PASSWORD:}

# Activación y Validación de Flyway
spring.flyway.enabled=${FLYWAY_ENABLED:true}
spring.flyway.locations=${FLYWAY_LOCATIONS:classpath:db/migration}
spring.flyway.validate-on-migrate=${FLYWAY_VALIDATE:true}
spring.flyway.baseline-on-migrate=${FLYWAY_BASELINE:true}

# Actuator — Health check para Docker y futuros load balancers
management.endpoints.web.exposure.include=health
management.endpoint.health.show-details=never

google.client.id=${GOOGLE_CLIENT_ID}
jwt.secret=${JWT_SECRET}
jwt.expiration.ms=${JWT_EXPIRATION_MS:900000}

spring.main.web-application-type=servlet

# Microsoft OAuth2 Configuration
microsoft.tenant.id=${MICROSOFT_TENANT_ID}

spring.security.oauth2.resourceserver.jwt.jwk-set-uri=https://smashing-termite-19.clerk.accounts.dev/.well-known/jwks.json

clerk.secret.key=${CLERK_SECRET_KEY}

# ==========================================
# LOGGING — base defaults (safe for every environment)
# Per-environment overrides live in application-{dev,qa,prod}.properties
# ==========================================

# Colored console output so ERROR/WARN/INFO/DEBUG are visually distinguishable
logging.pattern.console=%clr(%d{yyyy-MM-dd HH:mm:ss.SSS}){faint} %clr([%thread]){magenta} %clr(%-5level) %clr(%logger{36}){cyan} - %msg%n

logging.level.root=INFO
logging.level.com.ucebuslink=INFO
logging.level.org.hibernate.SQL=WARN
logging.level.org.springframework.web.socket=INFO
logging.level.org.springframework.messaging=INFO
logging.level.org.springframework.security=WARN


################################################

# Habilitar inserciones y actualizaciones por lotes en Hibernate
spring.jpa.properties.hibernate.jdbc.batch_size=50
spring.jpa.properties.hibernate.order_inserts=true
spring.jpa.properties.hibernate.order_updates=true

# ===========================================
# CONFIGURACIÓN DE GOOGLE MAPS API
# ===========================================
google.maps.api-key=${GOOGLE_MAPS_API_KEY}

# Credenciales de Firebase inyectadas por entorno
firebase.credentials=${FIREBASE_CREDENTIALS:}
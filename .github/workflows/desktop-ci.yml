name: Desktop CI

on:
  push:
    branches-ignore:
      - dev
      - qa
      - main
    paths:
      - 'uce-buslink-frontend/uce-buslink-desktop/**'
      - '.github/workflows/desktop-ci.yml'

permissions:
  contents: read

jobs:
  build-and-test:
    name: Desktop Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3

      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: uce-buslink-frontend/uce-buslink-desktop/package.json

      - name: Install dependencies
        working-directory: uce-buslink-frontend/uce-buslink-desktop
        run: npm install

      - name: Lint
        working-directory: uce-buslink-frontend/uce-buslink-desktop
        run: npm run lint

      - name: Build
        working-directory: uce-buslink-frontend/uce-buslink-desktop
        run: npm run build


name: Desktop CI

on:
  push:
    branches-ignore:
      - dev
      - qa
      - main
    paths:
      - 'uce-buslink-frontend/uce-buslink-desktop/**'
      - '.github/workflows/desktop-ci.yml'

permissions:
  contents: read

jobs:
  build-and-test:
    name: Desktop Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: uce-buslink-frontend/uce-buslink-desktop/package.json

      - name: Install dependencies
        working-directory: uce-buslink-frontend/uce-buslink-desktop
        run: npm install

      - name: Lint
        working-directory: uce-buslink-frontend/uce-buslink-desktop
        run: npm run lint

      - name: Build
        working-directory: uce-buslink-frontend/uce-buslink-desktop
        run: npm run build

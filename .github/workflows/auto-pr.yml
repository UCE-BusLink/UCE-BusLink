name: Auto PR

on:
  workflow_run:
    workflows:
      - Backend CI
      - Mobile CI
      - Desktop CI
    types:
      - completed

permissions:
  contents: read
  pull-requests: write

jobs:
  create-pr:
    if: ${{ github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest

    steps:
      - name: Create pull request to dev
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const run = context.payload.workflow_run;
            const headBranch = run.head_branch;
            const baseBranch = 'dev';

            if (!headBranch || headBranch === baseBranch) {
              core.info(`Skipping PR creation for branch: ${headBranch}`);
              return;
            }

            const { data: existing } = await github.rest.pulls.list({
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: 'open',
              head: `${context.repo.owner}:${headBranch}`,
              base: baseBranch,
            });

            if (existing.length > 0) {
              core.info(`Pull request already exists for ${headBranch} -> ${baseBranch}`);
              return;
            }

            await github.rest.pulls.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: `Auto PR: ${headBranch} -> ${baseBranch}`,
              head: headBranch,
              base: baseBranch,
              body: [
                `Automated pull request created after successful CI completion.`,
                `Source workflow: ${run.name}`,
                `Source branch: ${headBranch}`,
                `Source SHA: ${run.head_sha}`,
              ].join('\n\n'),
            });
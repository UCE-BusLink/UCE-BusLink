name: Mobile CI

on:
  push:
    branches-ignore:
      - dev
      - qa
      - main
    paths:
      - 'uce-buslink-frontend/uce-buslink-mobile/**'

permissions:
  contents: read

jobs:
  validate:
    name: Mobile Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3

      - name: Install dependencies
        working-directory: uce-buslink-frontend/uce-buslink-mobile
        run: npm ci

      - name: Lint
        working-directory: uce-buslink-frontend/uce-buslink-mobile
        run: npm run lint

      - name: Build
        working-directory: uce-buslink-frontend/uce-buslink-mobile
        run: npm run build

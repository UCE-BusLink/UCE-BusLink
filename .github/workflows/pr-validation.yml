name: PR Validation

on:
  pull_request:
    branches:
      - dev
      - qa
      - main

permissions:
  contents: read

jobs:
  validate:
    name: Validate Monorepo Structure
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3

      - name: Validate backend pom.xml
        run: test -f uce-buslink-backend/pom.xml

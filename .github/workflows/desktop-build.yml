name: Desktop Build

on:
  push:
    branches:
      - main
    paths:
      - 'uce-buslink-desktop/**'
  pull_request:
    branches:
      - main
    paths:
      - 'uce-buslink-desktop/**'

jobs:
  validate:
    name: Desktop Structure Validation
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Validate package.json exists
        run: test -f uce-buslink-desktop/package.json

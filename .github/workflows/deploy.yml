name: Deploy to EC2
on:
  push:
    branches:      
      - qa
      - main

jobs:
  deploy:
    name: Deploy to EC2
    runs-on: ubuntu-latest
    steps:
      - name: Set environment variables
        run: |
          if [ "${{ github.ref_name }}" == "main" ]; then
            echo "EC2_HOST=${{ secrets.EC2_HOST_PROD }}" >> $GITHUB_ENV
            echo "EC2_USER=${{ secrets.EC2_USER_PROD }}" >> $GITHUB_ENV
            echo "EC2_SSH_KEY=${{ secrets.EC2_SSH_KEY_PROD }}" >> $GITHUB_ENV
          else
            echo "EC2_HOST=${{ secrets.EC2_HOST_QA }}" >> $GITHUB_ENV
            echo "EC2_USER=${{ secrets.EC2_USER_QA }}" >> $GITHUB_ENV
            echo "EC2_SSH_KEY=${{ secrets.EC2_SSH_KEY_QA }}" >> $GITHUB_ENV
          fi

      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ env.EC2_HOST }}
          username: ${{ env.EC2_USER }}
          key: ${{ env.EC2_SSH_KEY }}
          script: |
            cd ~/uce-buslink

            if [ ! -f .env ]; then
              echo "DB_URL=jdbc:postgresql://uce-buslink-db:5432/uce_buslink_db" >> .env
              echo "DB_USERNAME=buslink_user" >> .env
              echo "DB_PASSWORD=BusLink2024Secure!" >> .env
              echo "DB_DRIVER=org.postgresql.Driver" >> .env
              echo "REDIS_HOST=uce-buslink-redis" >> .env
              echo "REDIS_PASSWORD=" >> .env
              echo "POSTGRES_USER=buslink_user" >> .env
              echo "POSTGRES_PASSWORD=BusLink2024Secure!" >> .env
              echo "POSTGRES_DB=uce_buslink_db" >> .env
              echo "MICROSOFT_TENANT_ID=common" >> .env
              echo "MICROSOFT_CLIENT_ID=placeholder" >> .env
              echo "MICROSOFT_CLIENT_SECRET=placeholder" >> .env
              echo "GOOGLE_CLIENT_ID=placeholder" >> .env
              echo "GOOGLE_CLIENT_SECRET=placeholder" >> .env
              echo "JWT_SECRET=ucebuslink-jwt-secret-key-2024-secure" >> .env
              echo "JWT_EXPIRATION_MS=900000" >> .env
            fi

            docker compose -f docker/docker-compose.yml pull
            docker compose -f docker/docker-compose.yml up -d --remove-orphans
            docker image prune -f
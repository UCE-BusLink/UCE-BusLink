name: Backend CI

on:
  push:
    branches:
      - dev
      - qa
      - main
    paths:
      - 'uce-buslink-backend/**'
      - '.github/workflows/backend-ci.yml'

jobs:
  # ─────────────────────────────────────────
  # JOB 1: Compilar y ejecutar tests
  # ─────────────────────────────────────────
  build-and-test:
    name: Backend Build & Test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: uce-buslink-backend

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: 'maven'

      - name: Build & Test
        run: mvn clean verify

  # ─────────────────────────────────────────
  # JOB 2: Build imagen Docker y push a DockerHub
  # Solo corre si el Job 1 pasó exitosamente
  # ─────────────────────────────────────────
  docker-build-push:
    name: Docker Build & Push
    runs-on: ubuntu-latest
    needs: build-and-test  # depende del job anterior

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      # Genera el tag corto del commit: ej. sha-a1b2c3d
      - name: Set short SHA
        id: vars
        run: echo "sha_short=sha-$(git rev-parse --short HEAD)" >> $GITHUB_OUTPUT

      # Login a DockerHub usando los secrets que acabas de crear
      - name: Login to DockerHub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      # Activa BuildKit para builds más rápidos y eficientes
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # Build y push con dos tags simultáneos
      - name: Build and push backend image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: docker/Dockerfile.backend
          push: true
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/uce-buslink-backend:${{ steps.vars.outputs.sha_short }}
            ${{ secrets.DOCKERHUB_USERNAME }}/uce-buslink-backend:qa
          # Cache entre runs para acelerar builds futuros
          cache-from: type=gha
          cache-to: type=gha,mode=max
